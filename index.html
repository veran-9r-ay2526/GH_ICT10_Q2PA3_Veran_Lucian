<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Working with Dictionaries</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
    <style>
        :root {
            box-sizing: border-box;
            --sky-top: #d9b99b;
            --sky-bottom: #e9dfc9;
            --paper: #f1e8d3;
            --ink: #26303b;
            --muted: #6c6a5f;
            --rose: #c98f7a;
            --teal: #5f7f80;
            --mustard: #c9a24a;
            --rule: rgba(38, 48, 59, .22);
        }
        /* Late-night version */
        @media (prefers-color-scheme: dark) {
            :root {
                --sky-top: #1b2433;
                --sky-bottom: #4a4358;
                --paper: #2c3442;
                --ink: #eadfc9;
                --muted: #a9a595;
                --rule: rgba(234, 223, 201, .22);
            }
        }
        *, *::before, *::after { box-sizing: inherit; }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            padding: calc(48px + env(safe-area-inset-top, 0px)) 18px calc(70px + env(safe-area-inset-bottom, 0px));
            color: var(--ink);
            font-family: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
            font-size: 17px;
            background: linear-gradient(var(--sky-top), var(--sky-bottom) 65%) fixed;
        }
        /* Film grain over everything */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background-image: var(--grain);
            pointer-events: none;
            z-index: 60;
        }

        .stage {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
        }

        /* The record peeking out from behind the sleeve */
        .record {
            position: absolute;
            right: -96px;
            top: 70px;
            width: 250px;
            height: 250px;
            border-radius: 50%;
            z-index: 0;
            background:
                conic-gradient(from 20deg, transparent 0 18%, rgba(255,255,255,.14) 24%, transparent 30% 68%, rgba(255,255,255,.1) 74%, transparent 80%),
                repeating-radial-gradient(circle, #121212 0 2px, #222 2px 4px);
            box-shadow: 0 14px 34px rgba(0, 0, 0, .35);
            animation: spin 14s linear infinite;
        }
        .record::before {
            content: "";
            position: absolute;
            inset: 33%;
            border-radius: 50%;
            background: var(--rose);
            box-shadow: inset 0 0 0 3px rgba(255, 255, 255, .25);
        }
        .record::after {
            content: "";
            position: absolute;
            inset: 48%;
            border-radius: 50%;
            background: var(--paper);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* The record sleeve */
        .sleeve {
            position: relative;
            z-index: 1;
            padding: 46px 34px 42px 70px;
            background: var(--paper);
            border: 1px solid var(--ink);
            box-shadow: 0 24px 44px -14px rgba(20, 20, 30, .45);
        }
        .sun {
            position: absolute;
            top: -34px;
            left: 86px;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: var(--rose);
            opacity: .92;
        }
        .jp {
            position: absolute;
            left: 22px;
            top: 34px;
            writing-mode: vertical-rl;
            color: var(--muted);
            font-size: 15px;
            letter-spacing: .35em;
        }

        h2 {
            position: relative;
            margin: 26px 0 34px;
            font-family: "Cormorant Garamond", "Zen Kaku Gothic New", serif;
            font-style: italic;
            font-weight: 600;
            font-size: clamp(2rem, 8vw, 3.1rem);
            line-height: 1.05;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 0;
        }
        form br { display: none; }

        input[type="text"] {
            width: 100%;
            padding: 8px 2px;
            font-family: "Cormorant Garamond", serif;
            font-style: italic;
            font-weight: 500;
            font-size: 1.6rem;
            color: var(--ink);
            background: transparent;
            border: 0;
            border-bottom: 1px solid var(--ink);
            border-radius: 0;
        }
        input[type="text"]::placeholder { color: var(--muted); opacity: .85; }

        input[type="button"] {
            align-self: flex-start;
            padding: 10px 32px;
            font: inherit;
            font-weight: 500;
            letter-spacing: .08em;
            color: var(--ink);
            background: transparent;
            border: 1.5px solid var(--ink);
            border-radius: 999px;
            cursor: pointer;
            transition: background .2s, color .2s;
        }
        input[type="button"]:hover { background: var(--mustard); color: #26303b; border-color: var(--mustard); }
        input[type="button"]:active { background: var(--rose); border-color: var(--rose); }
        input:focus-visible {
            outline: 2px solid var(--teal);
            outline-offset: 4px;
        }

        #resulta {
            margin-top: 36px;
            border-top: 1px solid var(--ink);
            line-height: 1.55;
            overflow-wrap: anywhere;
        }
        #resulta:empty { display: none; }
        #resulta > * {
            margin: 0;
            padding: 14px 0;
            border-bottom: 1px solid var(--rule);
        }

        @media (max-width: 640px) {
            .record { width: 170px; height: 170px; right: -52px; top: 46px; }
            .sleeve { padding: 42px 22px 36px 56px; }
            .jp { left: 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .record { animation: none; }
            input[type="button"] { transition: none; }
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="record" aria-hidden="true"></div>
        <div class="sleeve">
            <span class="sun" aria-hidden="true"></span>
            <span class="jp" aria-hidden="true">ゲームを作った人たち</span>
            <h2>Know the Creators of your favorite games!</h2>
            <form>
                <input type="text" id="dict" placeholder="Enter your favorite game"><br>
                <input type="button" py-click="game_details" value="Search">
            </form>
            <div id="resulta"></div>
        </div>
    </div>

    <script>
        // Draws the film grain (no image files needed)
        (function () {
            var c = document.createElement("canvas"), S = 140;
            c.width = c.height = S;
            var g = c.getContext("2d"), d = g.createImageData(S, S);
            for (var i = 0; i < d.data.length; i += 4) {
                var v = Math.random() * 255;
                d.data[i] = d.data[i + 1] = d.data[i + 2] = v;
                d.data[i + 3] = 34;
            }
            g.putImageData(d, 0, 0);
            document.documentElement.style.setProperty("--grain", "url(" + c.toDataURL() + ")");
        })();
    </script>

    <py-script src="main.py"></py-script>
</body>
</html>
